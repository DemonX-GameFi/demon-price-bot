name: DEMON Hourly Price Update
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: demon-price-state
  cancel-in-progress: false
jobs:
  send-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install chart library
        run: python -m pip install matplotlib==3.10.7
      - name: Check trades and send chart if needed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python price_bot.py
      - name: Save last checked time to repository
        run: |
          if [[ -f last_trade.json ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last_trade.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update DEMON trade check state [skip ci]"
              git push
            fi
          fi
